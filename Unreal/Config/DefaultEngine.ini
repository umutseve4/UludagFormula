;
; DefaultEngine.ini
;
; Engine-level configuration. Milestone 1 keeps this deliberately small: the
; project has no maps, no content and no physics assets yet, so any map path
; written here would point at nothing and produce a load failure on first
; open. Map and mode defaults arrive with Milestone 2.
;
; Status: statically inspected. requires Unreal Editor verification.

[/Script/Engine.Engine]
; Custom log categories are declared in AFLog.h and defined in AFLog.cpp.
; They are named here only so a shipping build still honours the verbosity
; set in the [Core.Log] section below.

[Core.Log]
; Default verbosity for the ApexFormula log categories. Verbose is available
; per-category at runtime via the "log LogAFRace Verbose" console command.
LogAFCore=Log
LogAFVehicle=Log
LogAFRace=Log
LogAFPipeline=Log
LogAFUI=Log

[/Script/Engine.PhysicsSettings]
bTickPhysicsAsync=True
; Physics runs on a fixed timestep. Deterministic replay (decision D-014)
; depends on the simulation not varying with frame rate, and a vehicle model
; that changes behaviour when the display refresh changes is not testable.
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6
; ApexFormula authors in metres and converts at the boundary (decision D-013,
; see AFUnits.h). Unreal itself remains in centimetres.
DefaultGravityZ=-980.000000

[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.MotionBlur=False
r.Shadow.Virtual.Enable=1
; Deferred shading. Decision D-011 puts final shading in Unreal rather than
; in Blender, so the renderer configuration is part of the art contract.
r.SkinCache.CompileShaders=True

[/Script/Engine.CollisionProfile]
; Checkpoint volumes overlap participants and never block them. AAFCheckpoint
; sets its responses in code rather than relying on a named profile, so no
; custom profile is registered here; this section is present as the documented
; place for one if a later milestone needs it.

[/Script/EngineSettings.GameMapsSettings]
; Deliberately empty at Milestone 1. See the header comment.

[ConsoleVariables]
; D-084 (OPEN-080-A): the real root cause of the skeleton root importing at
; Scale=(100,100,100) is UE 5.4+'s Interchange FBX importer, which folds the
; m->cm unit conversion (FBX UnitScaleFactor=100) into the skeleton root's
; reference pose. The exported FBX itself is correct: object/bone nodes at
; scale 1.0, units declared in file metadata (FBX_SCALE_UNITS, D-083).
; Fix: fall back to the legacy FBX importer, which converts units by scaling
; geometry/bind-pose data and leaves the root bone at (1,1,1). This is the
; Epic-documented switch ("Interchange FBX options" knowledge base article):
; it disables Interchange for the FBX format ONLY; Interchange stays active
; for textures, MaterialX and glTF as recommended.
Interchange.FeatureFlags.Import.FBX=False

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
; SecurityToken is deliberately left empty. Unreal generates this value on
; demand and writes it back here, which is how a credential reached version
; control in the first place. Never commit a populated value: the editor
; regenerates one locally on next open, and a token in a public repository
; is a credential in a public repository regardless of how narrow its scope
; is. If this line ever reappears with a value, blank it again.
SecurityToken=
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

