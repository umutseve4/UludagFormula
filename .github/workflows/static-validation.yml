name: Static Validation

# Tier 1 verification only. Nothing is compiled here and no engine is
# installed. See Documentation/TECHNICAL_ARCHITECTURE.md section 9.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: af_static_validate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the documented floor in Tools/af_static_validate.py.
        # 3.12 catches anything that only works on older interpreters.
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report interpreter
        run: python --version

      - name: Run static validation
        run: python Tools/af_static_validate.py --root .

      - name: Self-test the interface override checker
        # Runs BEFORE the checker itself. A checker that has stopped
        # detecting its own mutations must fail the build rather than
        # report a green tree, because a green check from a broken
        # checker is worse than no check at all. Decision D-030.
        run: python Tools/af_validate_interfaces.py --self-test

      - name: Check interface override agreement
        run: python Tools/af_validate_interfaces.py --root .

      - name: Self-test the credential guard
        # Same ordering rule as D-030, same reason. The mutations here are
        # the ways Unreal actually writes the token back (bare, spaced,
        # indented, quoted, single character); if none of them turn this
        # step red any more, the guard below is decoration and the build
        # must say so instead of passing.
        run: python Tools/af_check_credentials.py --self-test

      - name: Check for committed credential values
        # Issue #45. This does not scan history and does not invalidate any
        # token that was already published; it only stops the value coming
        # back. Secret scanning + push protection remain the primary control.
        run: python Tools/af_check_credentials.py --root .

  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Byte-compile Tools
        run: python -m compileall -q Tools

      - name: Byte-compile Blender pipeline scripts
        # These import bpy and cannot be executed without Blender, but they
        # can still be parsed. A syntax error must never reach main.
        run: |
          if [ -d BlenderPipeline/scripts ]; then
            python -m compileall -q BlenderPipeline/scripts
          else
            echo "BlenderPipeline/scripts not present; nothing to compile."
          fi
