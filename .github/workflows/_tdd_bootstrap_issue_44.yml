name: TDD bootstrap for issue 44

on:
  push:
    branches:
      - security/config-hash-prefix-guard-44

permissions:
  contents: write

jobs:
  create-red-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/config-hash-prefix-guard-44
          fetch-depth: 0

      - name: Apply test-only RED change
        shell: python
        run: |
          from pathlib import Path

          path = Path("Tools/af_config_hash_guard.py")
          text = path.read_text(encoding="utf-8")

          old_name = "def t_b17_short_form_matches_full_digest(self):"
          new_name = "def t_b17_short_record_rejects_invented_suffix(self):"
          old_assertion = 'is_historical_claim("6486736f83b6fb7f" + "a" * 48)'
          new_assertion = 'not is_historical_claim("6486736f83b6fb7f" + "a" * 48)'

          if text.count(old_name) != 1:
              raise SystemExit(f"expected one old test name, found {text.count(old_name)}")
          if text.count(old_assertion) != 1:
              raise SystemExit(f"expected one old assertion, found {text.count(old_assertion)}")

          text = text.replace(old_name, new_name, 1)
          text = text.replace(old_assertion, new_assertion, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit and push test-only change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- Tools/af_config_hash_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/af_config_hash_guard.py
          git commit -m "test(config-hash): reject invented historical suffix"
          git push origin HEAD:security/config-hash-prefix-guard-44
