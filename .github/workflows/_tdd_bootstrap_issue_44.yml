name: TDD bootstrap for issue 44

on:
  push:
    branches:
      - security/config-hash-prefix-guard-44

permissions:
  contents: write

jobs:
  create-green-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/config-hash-prefix-guard-44
          fetch-depth: 0

      - name: Apply minimal GREEN change
        shell: python
        run: |
          from pathlib import Path

          path = Path("Tools/af_config_hash_guard.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              (
                  "if recorded.startswith(token) or token.startswith(recorded):",
                  "if recorded.startswith(token):",
              ),
              (
                  "in either direction",
                  "from a document prefix to a recorded digest",
              ),
              (
                  "B short recorded form matches a full claim",
                  "B short recorded form rejects an invented suffix",
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify self-test, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/af_config_hash_guard.py --self-test
          git diff --check
          git diff -- Tools/af_config_hash_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/af_config_hash_guard.py
          git commit -m "fix(config-hash): reject invented historical suffix"
          git push origin HEAD:security/config-hash-prefix-guard-44
