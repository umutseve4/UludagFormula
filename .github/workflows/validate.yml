name: validate

# Two independent gates:
#
#   static-validation  needs neither Unreal nor Blender. It is the fast,
#                      always-green-or-genuinely-broken gate.
#
#   blender-pipeline   installs Blender headlessly and actually executes
#                      af_smoke_test.py. This is what turns the Milestone 0B
#                      `requires Blender execution` labels into evidence.
#
# What this workflow deliberately cannot do: `requires local compilation`,
# `requires Unreal Editor verification`, `requires playtesting` and
# `requires visual inspection`. Unreal Engine cannot run on free hosted
# runners. Those labels stay unsatisfied until the project is built on a
# real Windows machine, and no green tick here should be read as covering
# them (Cross-Milestone Rule 1).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (no engine, no DCC)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, by design. No pip install step exists here
      # and none should be added.
      - name: Repository-wide static validator
        run: python3 Tools/af_static_validate.py --root .

      - name: Blender pipeline config self-check
        run: python3 BlenderPipeline/scripts/af_pipeline_config.py

      # Milestone 3. This EXECUTES the lap timing and lap validity rules.
      # It has to be its own step: the compileall step below byte-compiles
      # every script but runs none of them, so without this line the
      # self-test would compile cleanly and prove nothing.
      #
      # A pass here means the rules are self-consistent and satisfy M3
      # acceptance criteria 1-4 arithmetically. It does not mean the C++
      # compiles - nothing in this repository has ever been compiled.
      - name: Lap rules reference model self-test
        run: python3 Tools/af_lap_rules_model.py --self-test

      # Milestone 3, decision D-044. The step above proves the reference
      # model is self-consistent. It cannot notice that the model has
      # stopped describing the C++ it mirrors - that was the admitted hole
      # in D-042, whose mitigation was "review discipline, not automation".
      #
      # These two steps close it. The self-test runs FIRST and on purpose:
      # it mutates fixtures and asserts the guard REPORTS the drift, so a
      # guard that has quietly stopped detecting anything fails here rather
      # than passing the real check for the wrong reason.
      - name: Drift guard self-test
        run: python3 Tools/af_drift_guard.py --self-test

      # Then the same guard against the genuine checked-out sources.
      # A failure here means AFSectorTimer.cpp / AFLapValidator.cpp and
      # Tools/af_lap_rules_model.py disagree. Fix both sides. Do not
      # delete this step, and do not add continue-on-error to it.
      - name: C++/Python drift guard
        run: python3 Tools/af_drift_guard.py --root . --verbose

      # Milestone 3, acceptance criterion 5. This EXECUTES the test circuit
      # geometry generator. Same reasoning as the step above: compileall
      # would prove only that the file parses.
      #
      # The generator runs without bpy here, so a pass covers the layout
      # mathematics, the checkpoint and sector derivation, and the
      # hand-maintained mirror of UAFTrackDefinition::ValidateSelf()
      # (decision D-043). It does not cover the Blender mesh path.
      - name: Circuit generator self-test
        run: python3 BlenderPipeline/scripts/af_circuit_generate.py --self-test

      # Milestone 3, decision D-045. The step above proves the circuit
      # generator - including its copy of the track validator - is
      # self-consistent. It cannot notice that that copy has stopped
      # describing UAFTrackDefinition::ValidateSelf(), which was the last
      # unguarded mirror left in Milestone 3 after D-044.
      #
      # Same two-step shape and same reasoning as the lap rules guard
      # above: the self-test runs FIRST so a guard that has stopped
      # detecting its own mutations fails here instead of quietly passing
      # the real check.
      - name: Track drift guard self-test
        run: python3 Tools/af_track_drift_guard.py --self-test

      # Then against the genuine checked-out sources. A failure here means
      # Unreal/Source/ApexFormulaRace/Private/AFTrackDefinition.cpp and
      # validate_track_definition() in
      # BlenderPipeline/scripts/af_circuit_generate.py disagree on a
      # diagnostic, a predicate or a field. Fix both sides. Do not delete
      # this step, and do not add continue-on-error to it.
      #
      # This compares TEXT. It does not compile the C++ and it does not
      # execute the Python mirror.
      - name: Track definition drift guard
        run: python3 Tools/af_track_drift_guard.py --root . --verbose

      # Milestone 4, decision D-046. af_pipeline_config.py has always
      # computed a SHA-256 over effective_config(), and describe() has
      # always printed its first sixteen characters, but nothing failed
      # when that value changed. DESIGN is the single source of truth for
      # every generated dimension (D-041): one edited number changes every
      # downstream artefact and silently falsifies every hash quoted in
      # prose.
      #
      # Same two-step shape as the two guards above, same reason for the
      # ordering.
      - name: Configuration hash guard self-test
        run: python3 Tools/af_config_hash_guard.py --self-test

      # Then against the genuine checked-out sources. A failure here means
      # one of three things: the effective configuration changed and the
      # pin was not updated, a document quotes a hash that is no longer
      # current, or describe() stopped reporting the computed value. All
      # three are real. Fix the cause, never the check, and never add
      # continue-on-error to this step.
      #
      # This IMPORTS af_pipeline_config.py as plain CPython and reads
      # text. It does not start Blender, does not generate a mesh and does
      # not prove the configuration is correct - only that the module, the
      # pin and the prose agree.
      - name: Configuration hash guard
        run: python3 Tools/af_config_hash_guard.py --root . --verbose

      # Milestone 4, decision D-047. The vehicle mesh is generated by code,
      # and generated geometry can become inside-out, non-manifold,
      # degenerate or over-budget without anything noticing. Nothing did
      # notice: every box and every cylinder the generator emitted was
      # wound inward until this gate was written and found it.
      #
      # Same two-step shape and same ordering rationale as the guards
      # above. The self-test runs FIRST, imports nothing from the
      # generator and asserts the checks reject synthetic broken meshes,
      # so a gate that has stopped detecting anything fails here instead
      # of passing the real audit vacuously.
      - name: Mesh quality gate self-test
        run: python3 Tools/af_mesh_quality.py --self-test

      # Then against the genuine generated geometry. This IMPORTS
      # af_vehicle_generate.py and af_pipeline_config.py as plain CPython
      # and audits the mesh description they produce. A failure means the
      # geometry is defective - fix the generator, never the gate, and
      # never add continue-on-error to this step.
      #
      # It does not start Blender, does not export an FBX and does not
      # prove the mesh looks correct. Those labels stay unsatisfied.
      - name: Mesh quality gate
        run: python3 Tools/af_mesh_quality.py

      # Milestone 4, decision D-056. The bodywork geometry core carries its
      # own cases, and this line is what runs them. The compileall step
      # below imports nothing, so without this the module could ship green
      # with its maths inert - which is precisely the failure mode that
      # cost the previous af_bodywork_profile.py its acceptance: a suite
      # that never ran on any machine but the author's.
      #
      # This is the config-free half of the module. It EXECUTES the section
      # maths, the superellipse rings, the loft winding correction, the
      # manifold diagnostics, the convexity report and the planar texture
      # projection against synthetic control solids. A failure means the
      # geometry primitives are wrong - fix the module, never the cases,
      # and never add continue-on-error to this step.
      #
      # It does not start Blender, generates no part of the actual car and
      # does not prove any bodywork looks correct. The design-driven half
      # of the module, and the 42-case suite held on branch
      # milestone-4-bodywork, are both still outstanding.
      - name: Bodywork geometry core self-test
        run: python3 BlenderPipeline/scripts/af_bodywork_profile.py --self-test

      # Milestone 4, slice 3. af_mesh_export.py serialises the generated
      # bodywork to Wavefront OBJ and Stanford PLY. Its 21 cases have so
      # far run on exactly one machine, which is not evidence; this line
      # is what makes them evidence.
      #
      # It EXECUTES both writers, the OBJ parser, and the bit exact round
      # trip comparisons - every one of the twelve bodywork surfaces and
      # every collision proxy is written out, read back, and compared
      # vertex by vertex, face by face, and by signed volume. Coordinates
      # are emitted with %.17g precisely so those comparisons can demand
      # equality rather than tolerance. A failure means the serialisation
      # loses or corrupts geometry - fix the module, never the cases,
      # and never add continue-on-error to this step.
      #
      # It writes no file to disk, does not start Blender, and does not
      # prove the exported mesh looks correct. Only a human opening
      # AF_Bodywork_Combined.obj can do that.
      - name: Bodywork mesh export self-test
        run: python3 BlenderPipeline/scripts/af_mesh_export.py --self-test

      # Milestone 4, decision D-064. The self-test above round-trips the
      # geometry IN MEMORY. It never writes a file, so it cannot see the
      # one property the asset pipeline actually depends on: that two
      # separate runs of --dump produce byte-identical files.
      #
      # That property has been measured exactly once, by hand, on one
      # machine - 26 files, 112123 bytes, identical across two runs. A
      # measurement taken once on one machine is not a gate, which is the
      # same objection that put the two steps above into this file.
      #
      # This step re-runs the exporter twice into two scratch directories
      # and compares them recursively. Any difference - a set iterated in
      # a new order, a dict that stopped being insertion-ordered, a float
      # formatted differently, a timestamp or a path leaking into a
      # header - turns the check red. The comparison also fails when one
      # side is missing a file, so a dump that silently stops writing a
      # part is caught as well, and it fails on an empty tree, because
      # two empty directories compare equal and would make the whole
      # step vacuous.
      #
      # The comparison is done in python3 rather than with `diff -r` on
      # purpose. `if ! diff` cannot tell exit 1 (files differ) from exit
      # 127 (diff not installed), so a missing tool would be reported as
      # a determinism failure. That is not hypothetical: it is exactly
      # what happened when this step was rehearsed. python3 is already a
      # hard requirement of the two steps above, so this adds no new
      # dependency and removes one.
      #
      # Scope, stated honestly: this proves reproducibility of one
      # interpreter on one runner within one workflow run. It does NOT
      # prove determinism across Python versions, across platforms, or
      # over time, and it does not prove the bytes are CORRECT - only
      # that they are stable. Correctness of the exported surface is
      # still `requires visual inspection` and still unsatisfied.
      #
      # Fix the exporter, never the check, and never add continue-on-error
      # to this step. Neither directory is ever committed.
      - name: Bodywork export determinism (double dump, byte comparison)
        run: |
          set -uo pipefail
          dump_a="${RUNNER_TEMP}/af_dump_a"
          dump_b="${RUNNER_TEMP}/af_dump_b"
          rm -rf "${dump_a}" "${dump_b}"
          mkdir -p "${dump_a}" "${dump_b}"
          if ! python3 BlenderPipeline/scripts/af_mesh_export.py --dump "${dump_a}"; then
            echo "::error::First --dump run failed. The exporter cannot write its own output, so determinism is not the question yet."
            exit 1
          fi
          if ! python3 BlenderPipeline/scripts/af_mesh_export.py --dump "${dump_b}"; then
            echo "::error::Second --dump run failed after the first succeeded. That is worse than a mismatch: the exporter is not even repeatable."
            exit 1
          fi
          python3 - "${dump_a}" "${dump_b}" <<'PY'
          import hashlib, os, sys

          def tree(root):
              out = {}
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      rel = os.path.relpath(full, root)
                      with open(full, "rb") as handle:
                          blob = handle.read()
                      out[rel] = (len(blob), hashlib.sha256(blob).hexdigest())
              return out

          a_root, b_root = sys.argv[1], sys.argv[2]
          a, b = tree(a_root), tree(b_root)

          only_a = sorted(set(a) - set(b))
          only_b = sorted(set(b) - set(a))
          differ = sorted(k for k in set(a) & set(b) if a[k] != b[k])

          if only_a or only_b or differ:
              for rel in only_a:
                  print("::error::present in run A but not run B: %s" % rel)
              for rel in only_b:
                  print("::error::present in run B but not run A: %s" % rel)
              for rel in differ:
                  print("::error::bytes differ between runs: %s (A=%d B=%d)" % (rel, a[rel][0], b[rel][0]))
              print("::error::af_mesh_export.py --dump is not reproducible. Two runs of the "
                    "same code on the same commit produced different output. Do not relax "
                    "this check - find the unordered iteration, the unstable float format "
                    "or the leaked environment value that caused it.")
              raise SystemExit(1)

          if not a:
              print("::error::--dump produced no files at all. An empty tree compares equal "
                    "to an empty tree, which would make this check vacuous.")
              raise SystemExit(1)

          total = sum(size for size, _ in a.values())
          print("export determinism: %d files, %d bytes, byte-identical across two runs"
                % (len(a), total))
          PY

      - name: Byte-compile every script
        run: python3 -m compileall -q BlenderPipeline/scripts Tools

  blender-pipeline:
    name: Blender smoke test (headless)
    runs-on: ubuntu-latest
    needs: static-validation
    env:
      # Pinned to the series in VERSION_MATRIX.md. The exact patch release is
      # resolved at run time so a 5.2.x bump does not silently break CI.
      BLENDER_SERIES: '5.2'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Blender links against these even in --background mode.
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libice6

      # Every failure path below names itself via ::error::, which surfaces
      # as a check annotation without needing the job log. The previous
      # version failed silently under `set -e`, which is why -e is gone:
      # the failures worth seeing were the ones it was swallowing.
      - name: Resolve and install Blender ${{ env.BLENDER_SERIES }} LTS
        run: |
          set -uo pipefail
          release_root="https://download.blender.org/release/"
          base="${release_root}Blender${BLENDER_SERIES}/"
          echo "Listing ${base}"
          if ! listing="$(curl -fsSL "${base}")"; then
            published="$(curl -fsSL "${release_root}" \
              | grep -oE 'Blender[0-9]+\.[0-9]+' \
              | sort -Vu | tr '\n' ' ')"
            echo "::error::Blender series ${BLENDER_SERIES} has no directory at ${base}. Series actually published: ${published:-<parent listing also unavailable>}. The Blender ${BLENDER_SERIES} LTS assumption recorded in VERSION_MATRIX.md needs revisiting."
            exit 1
          fi
          archive="$(printf '%s' "${listing}" \
            | grep -oE "blender-${BLENDER_SERIES}\.[0-9]+-linux-x64\.tar\.xz" \
            | sort -V | tail -n 1)"
          if [ -z "${archive}" ]; then
            present="$(printf '%s' "${listing}" \
              | grep -oE 'blender-[0-9.]+-linux-x64\.tar\.xz' \
              | sort -Vu | tr '\n' ' ')"
            echo "::error::${base} exists but publishes no blender-${BLENDER_SERIES}.x linux-x64 archive. Present instead: ${present:-<no linux-x64 archives at all>}."
            exit 1
          fi
          echo "Resolved: ${archive}"
          if ! curl -fsSL -o blender.tar.xz "${base}${archive}"; then
            echo "::error::Download of ${base}${archive} failed after the archive was successfully resolved."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/blender"
          if ! tar -xf blender.tar.xz -C "${RUNNER_TEMP}/blender" --strip-components=1; then
            echo "::error::${archive} downloaded but could not be extracted."
            exit 1
          fi
          echo "${RUNNER_TEMP}/blender" >> "${GITHUB_PATH}"

      - name: Record the Blender version actually used
        run: blender --version

      # Exit codes, per BlenderPipeline/README.md §5:
      #   0 success · 1 validation failure · 2 bpy unavailable · 3 run failed
      # Reaching this step under `blender` means 2 is not expected; if it
      # appears, the invocation is wrong, not the content.
      - name: Run af_smoke_test.py end to end
        run: |
          blender --background --factory-startup \
            --python BlenderPipeline/scripts/af_smoke_test.py

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-pipeline-output
          path: |
            BlenderPipeline/reports/
            BlenderPipeline/exports/
            BlenderPipeline/generated/
          if-no-files-found: warn
