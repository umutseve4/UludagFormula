# One-shot maintenance workflow. Runs only on the fix/strip-utf8-bom branch.
#
# It strips UTF-8 BOMs from Unreal/Source and commits the result back to the
# branch. Doing the rewrite in CI rather than by hand means the set of
# affected files is established by the resulting diff, not by assertion.
#
# It is idempotent: the second run finds nothing to strip and pushes nothing,
# so the commit it makes does not retrigger an endless loop.
#
# This workflow and Tools/af_strip_bom.py are both deleted before merge.
name: strip-bom

on:
  push:
    branches:
      - fix/strip-utf8-bom

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Strip BOMs
        run: python Tools/af_strip_bom.py | tee bom-report.txt

      - name: Commit the rewrite if anything changed
        run: |
          if [ -n "$(git status --porcelain -- Unreal/Source)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A Unreal/Source
            git commit -m 'fix(encoding): strip UTF-8 BOM from Unreal source files'
            git push
            echo 'BOM_COMMIT=yes' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No BOM-prefixed files remain; nothing committed.'
          fi

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: bom-report
          path: bom-report.txt
